appId: ai.skillbox.desktop
productName: Skillbox
executableName: SkillboxApp
directories:
  output: release
  buildResources: resources
files:
  - out/**/*
  - resources/icon.png
  - resources/icon.ico
  - "!node_modules"
  - node_modules/better-sqlite3/**/*
  - node_modules/bindings/**/*
  - node_modules/file-uri-to-path/**/*
  - node_modules/prebuild-install/**/*
extraResources:
  - from: resources/icon.png
    to: icon.png
  - from: resources/icon.ico
    to: icon.ico
npmRebuild: true
asarUnpack:
  - "**/*.node"
extraMetadata:
  main: out/main/index.js

mac:
  icon: resources/icon.icns
  category: public.app-category.developer-tools
  minimumSystemVersion: "11.0.0"
  artifactName: "Skillbox-${version}-${arch}.${ext}"
  target:
    - dmg
    - zip
  entitlements: resources/entitlements.mac.plist
  entitlementsInherit: resources/entitlements.mac.plist
  notarize: true

win:
  icon: resources/icon.ico
  artifactName: "Skillbox-Setup-${version}.${ext}"
  target: nsis

nsis:
  guid: 123a0f9b-e728-5938-995d-f0f4ed1a37b3
  oneClick: false
  perMachine: false
  allowToChangeInstallationDirectory: true
  shortcutName: Skillbox
  installerIcon: resources/icon.ico
  uninstallerIcon: resources/icon.ico
  installerHeaderIcon: resources/icon.ico

linux:
  icon: resources/icon.png
  target:
    - AppImage
    - deb
  category: Development
  artifactName: "Skillbox-${version}-${arch}.${ext}"

publish:
  provider: github
  owner: Renly1994
  repo: Skillbox
